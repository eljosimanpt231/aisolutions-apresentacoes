<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AI Solutions</title>
  <style>
    :root { --bg: #0a0a1a; --fg: #eef0f6; --muted: #8a90a6; --accent: #6c5ce7; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin-top: 0.6rem; font-size: 0.95rem; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI <span>Solutions</span></h1>
    <p>Apresentações personalizadas. Se recebeste um link, abre-o diretamente.</p>
    <p><a href="https://aisolutions.pt">aisolutions.pt</a></p>
  </div>
</body>
</html>
